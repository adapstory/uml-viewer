[project]
name = "uml-viewer-desktop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2"]

[project.scripts]
uml-viewer-desktop = "uml_viewer_desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uml_viewer_desktop"]
